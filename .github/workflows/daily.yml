name: Daily analyst report digest

on:
  # 예약 실행 없음 ─ Actions 탭에서 직접 실행 (Run workflow). 예약은 나중에 다시 추가 예정.
  workflow_dispatch:
    inputs:
      date:
        description: "대상 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300       # 배치 대기 포함 (보통 10분 내외)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 종목→업종 캐시를 실행 간 재사용
      - uses: actions/cache@v4
        with:
          path: cache
          key: sectors-${{ github.run_id }}
          restore-keys: sectors-

      - name: 대상 날짜 결정
        run: echo "DATE=$(python target_date.py '${{ github.event.inputs.date }}')" >> "$GITHUB_ENV"

      # 같은 날 앞선 실행(중단된 실행 등)의 수집·요약 결과 복원 → 이미 요약한 건 다시 요약하지 않음
      - name: 그날 데이터 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            data/reports
            data/summaries
            data/pdfs
            data/state.json
          key: data-${{ env.DATE }}-${{ github.run_id }}
          restore-keys: data-${{ env.DATE }}-

      - name: 1. 수집
        run: python collect.py --date "$DATE"

      - name: 2. AI 요약 (배치)
        run: python summarize.py --date "$DATE" --delete-pdfs --max-wait 16200

      - name: 3. Notion 게시
        if: always()   # 요약 일부 실패해도 수집분은 게시
        run: python publish_notion.py --date "$DATE"

      - name: 그날 데이터 저장 (다음 실행용)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/reports
            data/summaries
            data/pdfs
            data/state.json
          key: data-${{ env.DATE }}-${{ github.run_id }}

      - name: 결과 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summaries-${{ env.DATE }}
          path: data/summaries/
          retention-days: 30
